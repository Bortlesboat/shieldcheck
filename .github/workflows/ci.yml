name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test Node contracts
        run: npm test
      - name: Build the allowlisted site
        run: npm run build:site

  launcher:
    name: Windows launcher controls
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test owned-client lifecycle controls
        shell: pwsh
        run: pwsh -NoProfile -File ./test/launcher.test.ps1

  native:
    name: Native Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.97.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - name: Record compiler versions
        run: |
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - name: Test the locked release build
        run: cargo test --locked --release --manifest-path native/Cargo.toml
      - name: Check Clippy
        run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
